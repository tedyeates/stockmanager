{% load crispy_forms_tags %}
<div class="modal fade" id="{{modal_id}}" tabindex="-1" role="dialog" aria-labelledby="{{modal_id}}Label" aria-hidden="true">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="{{modal_id}}-label">{{title}}</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      {# Concatenate form_type to app name to create url name to post to #}
      {% with "stockmanagement:"|add:form_type as post_url %}
      <form action="{% url post_url %}" method="post">
      {% endwith %}
        <div class="modal-body">
          {% csrf_token %}
          <input type="hidden" name="form-name" value="{{modal_id}}">
          {{ form|crispy }}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="submit" class="btn btn-primary">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>
